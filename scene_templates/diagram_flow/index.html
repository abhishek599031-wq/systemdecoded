<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SystemDecoded · diagram_flow</title>
    <link rel="stylesheet" href="../_base/tokens.css" />
    <style>
      /* Vertical chain of nodes joined by connectors. The workhorse template:
         any "A talks to B talks to C" idea renders here. Connectors can be
         marked `blocked` to show a path that does NOT happen — which is how we
         correct a viewer's assumption without saying "wrong". */
      .flow {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        width: 100%;
      }

      .step {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .step .node {
        width: 100%;
        max-width: 720px;
      }

      .link {
        position: relative;
        width: 6px;
        height: 118px;
        background: linear-gradient(180deg, var(--line-bright), var(--cyan-deep));
        border-radius: 3px;
        overflow: visible;
      }

      /* Travelling pulse — shows direction of flow. */
      .link__pulse {
        position: absolute;
        left: 50%;
        width: 22px;
        height: 22px;
        margin-left: -11px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 28px 6px rgba(34, 211, 238, 0.55);
      }

      .link__note {
        position: absolute;
        left: 64px;
        top: 50%;
        transform: translateY(-50%);
        white-space: nowrap;
        font-size: var(--fs-xs);
        font-weight: 600;
        color: var(--muted);
      }

      .link--blocked {
        background: repeating-linear-gradient(
          180deg,
          var(--dim) 0 14px,
          transparent 14px 28px
        );
      }
      .link--blocked .link__pulse {
        display: none;
      }
      .link__x {
        opacity: 0;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: rgba(248, 113, 113, 0.12);
        border: 3px solid var(--bad);
        color: var(--bad);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        font-weight: 800;
        line-height: 1;
      }

      .caption {
        margin-top: var(--gap-lg);
        max-width: 820px;
        text-align: center;
      }
      .title {
        margin-bottom: var(--gap-lg);
        max-width: 840px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="content center">
        <div class="eyebrow" id="eyebrow"></div>
        <div class="h2 title" id="title"></div>
        <div class="flow" id="flow"></div>
        <div class="body caption" id="caption"></div>
      </div>
      <div class="watermark">SystemDecoded</div>
    </div>

    <script src="../_base/scene.js"></script>
    <script>
      window.__DEMO_PROPS__ = {
        eyebrow: "The assumption",
        title: "Most people think the code is *sent*.",
        nodes: [
          { label: "Server", value: "generates a code" },
          { label: "Your phone", value: "receives it" },
        ],
        links: [{ note: "over the network", blocked: true }],
        caption: "It never happens.",
      };

      const markup = (s) =>
        window.esc(s || "").replace(/\*(.+?)\*/g, '<span class="accent">$1</span>');

      window.build = function (p) {
        document.getElementById("eyebrow").textContent = p.eyebrow || "";
        const title = document.getElementById("title");
        title.innerHTML = markup(p.title);
        title.style.display = p.title ? "block" : "none";

        const caption = document.getElementById("caption");
        caption.innerHTML = markup(p.caption);
        caption.style.display = p.caption ? "block" : "none";

        const flow = document.getElementById("flow");
        flow.innerHTML = "";
        const nodes = p.nodes || [];
        const links = p.links || [];

        nodes.forEach((n, i) => {
          if (i > 0) {
            const cfg = links[i - 1] || {};
            const link = document.createElement("div");
            link.className = "link" + (cfg.blocked ? " link--blocked" : "");
            link.dataset.i = String(i - 1);
            if (!cfg.blocked) {
              const pulse = document.createElement("div");
              pulse.className = "link__pulse";
              link.appendChild(pulse);
            } else {
              const x = document.createElement("div");
              x.className = "link__x";
              x.textContent = "✕";
              link.appendChild(x);
            }
            if (cfg.note) {
              const note = document.createElement("div");
              note.className = "link__note";
              note.textContent = cfg.note;
              link.appendChild(note);
            }
            flow.appendChild(link);
          }

          const step = document.createElement("div");
          step.className = "step";
          const node = document.createElement("div");
          node.className = "node" + (n.active ? " node--active" : "") + (n.muted ? " node--muted" : "");
          node.dataset.i = String(i);
          node.innerHTML =
            '<div class="node__label">' +
            window.esc(n.label || "") +
            '</div><div class="node__value">' +
            markup(n.value) +
            "</div>";
          step.appendChild(node);
          flow.appendChild(step);
        });
      };

      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      const easeOut = (v) => 1 - Math.pow(1 - clamp01(v), 3);

      window.draw = function (t) {
        const nodes = document.querySelectorAll(".node");
        const n = nodes.length || 1;

        // Nodes appear in reading order, as the narration introduces them.
        nodes.forEach((el, i) => {
          const local = easeOut((t - (i / n) * 0.4) / 0.3);
          el.style.opacity = String(0.1 + local * 0.9);
          el.style.transform = `translateY(${(1 - local) * 26}px)`;
        });

        document.querySelectorAll(".link").forEach((el, i) => {
          const appear = easeOut((t - ((i + 0.5) / n) * 0.4) / 0.28);
          el.style.opacity = String(appear);

          const pulse = el.querySelector(".link__pulse");
          const cross = el.querySelector(".link__x");

          if (cross) {
            // The blocked path: a signal sets off, gets barely anywhere, and is
            // stopped. Showing the attempt AND its failure is what makes
            // "nothing is transmitted" land without narration having to insist.
            const attemptStart = 0.34;
            const attempt = clamp01((t - attemptStart) / 0.22);
            const stopped = t >= attemptStart + 0.22;
            let dot = el.querySelector(".link__try");

            if (!stopped && attempt > 0) {
              if (!dot) {
                dot = document.createElement("div");
                dot.className = "link__pulse link__try";
                el.appendChild(dot);
              }
              dot.style.display = "block";
              // Travels only ~40% of the way before it is cut off.
              dot.style.top = `${attempt * 40}px`;
              dot.style.opacity = String(1 - attempt * 0.35);
            } else if (dot) {
              dot.style.display = "none";
            }

            const x = easeOut((t - (attemptStart + 0.2)) / 0.18);
            cross.style.opacity = String(x);
            cross.style.transform = `translate(-50%, -50%) scale(${0.72 + x * 0.28})`;
          } else if (pulse) {
            // An open path: the pulse completes the journey, looping so the
            // link reads as active for the whole scene.
            const travel = ((t - 0.3) * 1.9) % 1;
            const visible = t > 0.3;
            pulse.style.opacity = visible ? String(1 - Math.abs(travel - 0.5) * 0.5) : "0";
            pulse.style.top = `${clamp01(travel) * 96}px`;
          }
        });

        const title = document.getElementById("title");
        const ta = easeOut(t / 0.26);
        title.style.opacity = String(ta);
        title.style.transform = `translateY(${(1 - ta) * 18}px)`;
      };
    </script>
  </body>
</html>
