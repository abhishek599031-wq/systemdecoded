[project]
name = "systemdecoded-backend"
version = "0.1.0"
description = "SystemDecoded — autonomous YouTube content operations system (backend)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "cryptography>=43.0",
]

[project.optional-dependencies]
# Provider-neutral media production stack. Kept optional so the API and
# scheduler images stay slim; only the worker needs it (ARCH §15.2).
media = [
    "faster-whisper>=1.1",
    # faster-whisper 1.2.1 passes metadata_errors to av.open; PyAV 19 removed
    # that keyword. Remove this cap after a faster-whisper release includes
    # upstream fix 2ce7f9d.
    "av>=11,<19",
    "playwright>=1.49",
    "soundfile>=0.12",
    "numpy>=1.26",
]
# Retained for legacy/isolated Kokoro environments. Current kokoro-onnx needs
# NumPy 2.x, while Chatterbox needs NumPy <2, so these providers must not be
# installed into the same worker environment.
kokoro = [
    "kokoro-onnx>=0.4.9",
    "onnxruntime>=1.20",
]
# Approved local GPU narrator for the production worker.
chatterbox = [
    "chatterbox-tts==0.1.7",
    # PyPI resemble-perth 1.0.1 still imports pkg_resources, which setuptools
    # 81+ removed. This immutable upstream 1.1.0 revision contains the verified
    # importlib.resources repair and compatible torch>=2.1 metadata.
    "resemble-perth @ git+https://github.com/resemble-ai/Perth.git@ff1c8ac55a976971245cdd53c18d6131ca00d993",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires a live PostgreSQL instance",
    "media: requires FFmpeg, Chromium and the speech models (worker image only)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "BLE", "RUF"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    # ASYNC240 flags pathlib in async functions. We are on asyncio, not trio,
    # and the calls it catches are exists()/stat() on local disk — microsecond
    # syscalls, not an event-loop hazard. The genuinely blocking work (model
    # inference, FFmpeg) is already offloaded to threads and subprocesses.
    "ASYNC240",
    # ASYNC109: our subprocess helpers take an explicit timeout budget. The rule
    # wants callers to pass a cancellation scope instead, which does not apply
    # to a wrapper whose whole purpose is bounding an external process.
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
# Narration and scene copy are content, not code. Wrapping these strings to fit
# a column limit makes the script harder to read and edit.
"app/services/seed_first_video.py" = ["E501"]
