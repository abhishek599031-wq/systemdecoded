name: systemdecoded-tests

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: systemdecoded
      POSTGRES_PASSWORD: systemdecoded
      POSTGRES_DB: systemdecoded_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systemdecoded -d systemdecoded_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  integration-test:
    build:
      context: ./backend
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://systemdecoded:systemdecoded@postgres-test:5432/systemdecoded_test
      DATABASE_URL: postgresql+psycopg://systemdecoded:systemdecoded@postgres-test:5432/systemdecoded_test
      REQUIRE_TEST_DATABASE: "true"
      ENVIRONMENT: test
      DEBUG: "true"
      LOG_LEVEL: WARNING
      LOG_FORMAT: console
      SCENE_TEMPLATES_DIR: /scene_templates
    volumes:
      - ./scene_templates:/scene_templates:ro
    command: ["pytest", "tests/integration", "-m", "not media", "--tb=short", "-q"]
    depends_on:
      postgres-test:
        condition: service_healthy
